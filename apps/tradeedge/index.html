<!doctype html>
<html lang="en" data-desk="trade">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>TradeEdge</title>
    <script>
      // Paint the shared theme (the shell's prefs cookie) before the app loads.
      try {
        var m = document.cookie.match(/(?:^|; )edgedesk_prefs=([^;]*)/);
        var t = m ? JSON.parse(decodeURIComponent(m[1])).theme : 'light';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
